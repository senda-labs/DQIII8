[Service]
# docker.service (re)creates the DOCKER-USER chain with its own permissive
# defaults on every start — including after a host reboot, where iptables
# rules are not persisted (no iptables-persistent on netcup-rs4000). Without
# this, the DOCKER-USER hardening applied by docker-user-harden.sh is lost
# silently on the next reboot, re-exposing any future published container
# port to the world despite UFW's deny-by-default.
ExecStartPost=/usr/local/sbin/docker-user-harden.sh
