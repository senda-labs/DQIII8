[extend]
useDefault = true

# ── Custom rules for DQIII8 secrets ──────────────────────────────────────────

[[rules]]
id = "nvidia-nim-key"
description = "NVIDIA NIM / NGC API Key"
regex = '''nvapi-[A-Za-z0-9_-]{20,}'''
tags = ["api-key", "nvidia"]

[[rules]]
id = "telegram-bot-token"
description = "Telegram Bot Token"
# Require context keyword before the value to avoid matching arbitrary number:string patterns
regex = '''(?i)(?:telegram|bot_token|BOT_TOKEN|DQIII8_BOT_TOKEN)\s*[=:]\s*\d{8,12}:[A-Z][A-Za-z0-9_-]{34}'''
tags = ["api-key", "telegram"]

[[rules]]
id = "groq-api-key"
description = "Groq API Key"
regex = '''gsk_[A-Za-z0-9]{50,}'''
tags = ["api-key", "groq"]

[[rules]]
id = "openrouter-key"
description = "OpenRouter API Key"
regex = '''sk-or-v1-[A-Za-z0-9]{60,}'''
tags = ["api-key", "openrouter"]

[[rules]]
id = "elevenlabs-key"
description = "ElevenLabs API Key"
regex = '''sk_[a-f0-9]{48}'''
tags = ["api-key", "elevenlabs"]

[[rules]]
id = "firecrawl-key"
description = "Firecrawl API Key"
# Require key assignment context to avoid matching fc- inside URLs/auth tokens
regex = '''(?i)(?:firecrawl|FIRECRAWL_API_KEY)\s*[=:]\s*fc-[A-Za-z0-9]{30,}'''
tags = ["api-key", "firecrawl"]

[[rules]]
id = "spanish-ip-vps"
description = "Known VPS IP — must not appear in committed files"
regex = '''159\.195\.149\.\d{1,3}'''
tags = ["infra", "ip"]

[[rules]]
id = "netcup-vps-ip"
description = "Current (Netcup) VPS IP — must not appear in committed files"
regex = '''76\.13\.40\.235'''
tags = ["infra", "ip"]

[[rules]]
id = "known-leaked-credential-literal"
description = "Exact credential value already involved in a real leak (POSTGRES_PASSWORD=REDACTED) — plain alphanumeric, so the special-char-required generic rule below misses it"
regex = '''(?i)POSTGRES_(?:USER|PASSWORD|DB)=hostkey|password\s*`hostkey`\s*for\s*user\s*`hostkey`'''
tags = ["credential", "password"]

[[rules]]
id = "generic-credential-literal"
description = "Human-readable password/credential literal near a password/contraseña keyword"
# Catches cases like: `password admin Mautic (`JanusKeys2026!` -> nueva)` — missed by
# entropy-based detectors because the literal isn't high-entropy, just a real word+digits+symbol.
regex = '''(?i)(?:password|contraseñ\w*|passwd).{0,40}[`'"]([A-Za-z0-9]{6,}[!@#$%^&*][A-Za-z0-9!@#$%^&*]*|[A-Za-z0-9!@#$%^&*]*[!@#$%^&*][A-Za-z0-9]{6,})[`'"]'''
tags = ["credential", "password"]

[[rules]]
id = "generic-vps-ip-literal"
description = "Bare public IPv4 adjacent to an ssh/root/vps context keyword"
regex = '''(?i)(?:ssh\s+root@|ssh\s+\S+@|vps\s+ip|servidor\s+ip)\s*[:=]?\s*((?:\d{1,3}\.){3}\d{1,3})'''
tags = ["infra", "ip"]

# ── F-26 closure: audit/doc corpus is now git-tracked, so scan it harder ─────
# `database/audit_reports/*.md` was un-ignored on 2026-08-17 so review findings
# survive in git. That reopens exactly the mechanical hole that caused F-26 (a
# stress-test report carrying a raw VPS IP + DB credentials). The two rules
# below are deliberately broad (ANY bare IPv4, ANY password literal) and scoped
# to the audit/doc corpus only, so they don't fire across the whole codebase.

[[rules]]
id = "audit-docs-bare-ipv4"
description = "Bare IPv4 address inside an audit report or doc (F-26 root cause) — redact or use a placeholder"
regex = '''\b(?:\d{1,3}\.){3}\d{1,3}\b'''
path = '''(?:database/audit_reports/.*\.md|docs/.*)$'''
tags = ["infra", "ip", "audit-docs"]
[rules.allowlist]
description = "Non-routable / documentation / version-shaped values that are not real infra"
regexes = [
    # Loopback, unspecified, broadcast
    '''\b127\.(?:\d{1,3}\.){2}\d{1,3}\b''',
    '''\b0\.0\.0\.0\b''',
    '''\b255\.255\.255\.(?:\d{1,3})\b''',
    # RFC1918 private ranges (internal, not an exfiltration risk on their own)
    '''\b10\.(?:\d{1,3}\.){2}\d{1,3}\b''',
    '''\b192\.168\.\d{1,3}\.\d{1,3}\b''',
    '''\b172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}\b''',
    # RFC5737 documentation ranges
    '''\b192\.0\.2\.\d{1,3}\b''',
    '''\b198\.51\.100\.\d{1,3}\b''',
    '''\b203\.0\.113\.\d{1,3}\b''',
    # Reserved/non-routable literals that legitimately appear as *test vectors* in
    # security reports (SSRF allow/deny cases), not as infra addresses:
    # 169.254/16 link-local incl. the cloud-metadata address, 100.64/10 CGNAT,
    # 240/4 reserved. Verified 2026-08-17 against
    # database/audit_reports/2026-08-16-redteam-adversarial-audit.md, where all
    # occurrences are SSRF blocklist test inputs.
    '''\b169\.254\.\d{1,3}\.\d{1,3}\b''',
    '''\b100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.\d{1,3}\.\d{1,3}\b''',
    '''\b2(?:4[0-9]|5[0-5])\.\d{1,3}\.\d{1,3}\.\d{1,3}\b''',
    # Four-component version strings (e.g. 1.2.3.4 in a dependency table)
    '''(?:version|v|release)\s*[:=]?\s*\d{1,3}(?:\.\d{1,3}){3}''',
]

[[rules]]
id = "audit-docs-password-literal"
description = "Password/credential literal assigned inline inside an audit report or doc"
regex = '''(?i)\b(?:password|passwd|pwd|contrase(?:n|ñ)a|secret|api[_-]?key|token)\s*[:=]\s*(?:['"`][^'"`\n]{4,}['"`]|[^\s'"`,;)\]}]{6,})'''
path = '''(?:database/audit_reports/.*\.md|docs/.*)$'''
tags = ["credential", "password", "audit-docs"]
[rules.allowlist]
description = "Env-var indirection and obvious placeholders — the documented-correct way to write these"
regexes = [
    '''(?i)(?:password|passwd|pwd|secret|api[_-]?key|token)\s*[:=]\s*['"`]?(?:\$\{?[A-Z_][A-Z0-9_]*\}?|os\.environ|REDACTED|<[^>\n]+>|\.{3}|x{4,}|\*{4,}|TODO|CHANGEME|YOUR_[A-Z_]+|TU_[A-Z_]+)''',
    # Regex/rule definitions in this very config and in doc examples about scanning
    '''regex\s*=''',
]

# ── Global allowlist ──────────────────────────────────────────────────────────

[allowlist]
description = "Known safe patterns — placeholders, test fixtures, regex definitions"
regexes = [
    # Placeholder / example strings
    '''TU_API_KEY_AQUI''',
    '''YOUR_.*KEY''',
    '''gsk_YOUR_KEY''',
    '''sk-ant-YOUR_KEY''',
    '''gsk_x+''',

    # Test fixtures (truncated / fake values)
    '''sk-ant-oat01-truncated''',

    # Regex pattern definitions in source code (db_security.py etc.)
    '''r"ghp_''',
    '''r"sk-ant-''',
    '''r"gsk_''',

    # HTML/JS placeholder in dashboard
    '''gsk_&#8230''',
    '''sk-ant-&#8230''',
]
paths = [
    # Files intentionally containing key patterns
    '''bin/core/db_security\.py''',
    '''bin/ui/dashboard\.html''',
    '''bin/j\.sh''',
    '''tests/test_auth_watchdog\.py''',
    # Example / template files
    '''\.env\.example''',
    '''config/\.env\.example''',
    # Documentation examples
    '''docs/.*INICIO-RAPIDO\.md''',
    '''docs/APIS\.md''',
]
