[Service]
ExecStart=
ExecStart=/root/dqiii8/.venv-core/bin/python3 bin/ui/dqiii8_bot.py
# The base unit's PATH covers /usr/bin, where Hostinger's `claude` CLI lives —
# Netcup installed it under /root/.local/bin instead, so every subprocess call
# to "claude" (openrouter_wrapper.py's anthropic-tier path, used by the AGENT_
# ROUTING "default" agent) failed with "No such file or directory", silently
# swallowed up to a "(no response)" reply in Telegram (found 2026-09-07 via
# live testing after AGENT_ROUTING["default"] was fixed to route to anthropic).
Environment="PATH=/root/.local/bin:/root/.bun/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
