[project]
name = "dqiii8"
version = "1.0.0"
description = "Autonomous AI orchestration engine — cost-first multi-tier LLM router with knowledge injection"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"

# Core dependencies — used by the kernel (bin/). Subproject-specific heavy
# dependencies (crawl4ai, pdfplumber, sentence-transformers, etc.) live in
# each my-projects/<name>/requirements.txt, not here.
dependencies = [
    "requests>=2.31.0",
    "sqlite-vec==0.1.7",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0.1",
    "tiktoken>=0.12.0",
    "python-telegram-bot>=21.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "langgraph>=1.1.3",
    "agno>=2.6.19",
    "typing_extensions>=4.15.0",
    "groq>=1.1.1",
    "gTTS>=2.5.4",
    "openpyxl>=3.1.5",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pip-tools>=7.4.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["bin/tools/_archived", "my-projects", "database/legacy"]

[tool.ruff.lint]
# E,F = pycodestyle/pyflakes · B = bugbear · BLE = blind-except (catches
# `except Exception: pass`) · W = warnings
select = ["E", "F", "B", "BLE", "W"]
ignore = ["E501"]  # line length is advisory, not enforced

# Black and isort have no exclusion config of their own, so they walked into
# bin/tools/_archived (frozen historical copies) while ruff correctly skipped it.
# Keep all three in agreement.
[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "^/(bin/tools/_archived|my-projects|database/legacy)/"

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["bin/tools/_archived/*", "my-projects/*", "database/legacy/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
